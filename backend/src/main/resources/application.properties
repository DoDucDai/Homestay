server.port=${SERVER_PORT:8080}
spring.profiles.default=dev
server.address=${SERVER_ADDRESS:127.0.0.1}

# ============================================
# KET NOI SQL SERVER - Doc tu file .env
# Neu khong co .env, dung gia tri mac dinh
# ============================================
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:HomestayDB};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cho phep goi API tu Frontend (CORS)
auth.allowed-origins=${AUTH_ALLOWED_ORIGINS:}
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=HOMESTAY_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Cau hinh ma hoa UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
