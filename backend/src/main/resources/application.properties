# NOTE CẤU HÌNH: Cổng, địa chỉ lắng nghe và profile mặc định; cú pháp ${TÊN:mặc_định} cho phép cấu hình từ môi trường.
server.port=${SERVER_PORT:8080}
spring.profiles.default=dev
server.address=${SERVER_ADDRESS:127.0.0.1}

# ============================================
# KET NOI SQL SERVER - Doc tu file .env
# Neu khong co .env, dung gia tri mac dinh
# ============================================
# NOTE CẤU HÌNH: Thông số datasource của Spring; các controller hiện mở JDBC qua DBConnection, lớp đó tự kiểm tra cấu hình môi trường/TLS.
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:HomestayDB};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cho phep goi API tu Frontend (CORS)
# NOTE CẤU HÌNH: Danh sách origin frontend được phép gửi cookie qua CORS; để trống khi frontend/backend dùng chung origin.
auth.allowed-origins=${AUTH_ALLOWED_ORIGINS:}
# NOTE CẤU HÌNH: Thời hạn và cách theo dõi phiên bằng cookie; không đưa session ID vào URL.
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=HOMESTAY_SESSION
# NOTE CẤU HÌNH: HttpOnly chặn JavaScript đọc cookie, SameSite hạn chế gửi xuyên site; Secure được bật khi chạy qua HTTPS.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Cau hinh ma hoa UTF-8
# NOTE CẤU HÌNH: Buộc yêu cầu/phản hồi dùng UTF-8 để dữ liệu và thông báo tiếng Việt không bị sai dấu.
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
