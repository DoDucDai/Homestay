server.port=${SERVER_PORT:8080}

# ============================================
# KET NOI SQL SERVER - Doc tu file .env
# Neu khong co .env, dung gia tri mac dinh
# ============================================
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:HomestayDB};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cho phep goi API tu Frontend (CORS)
spring.mvc.cors.allowed-origins=*
