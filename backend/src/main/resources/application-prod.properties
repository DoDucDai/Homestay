# NOTE CẤU HÌNH: Profile prod chỉ gửi cookie qua HTTPS; các cấu hình trong file này ghi đè giá trị chung.
server.servlet.session.cookie.secure=true
# NOTE CẤU HÌNH: Thông số datasource prod yêu cầu tên máy/cổng/database rõ ràng và kiểm tra chứng chỉ SQL Server.
spring.datasource.url=jdbc:sqlserver://${DB_HOST}:${DB_PORT};databaseName=${DB_NAME};encrypt=true;trustServerCertificate=false
# NOTE CẤU HÌNH: Tin xử lý header chuyển tiếp của web server để nhận biết giao thức/host phía sau reverse proxy.
server.forward-headers-strategy=native
# NOTE CẤU HÌNH: Không đưa thông báo lỗi nội bộ hoặc stack trace vào trang lỗi mặc định của Spring.
server.error.include-message=never
server.error.include-stacktrace=never
# NOTE CẤU HÌNH: Tắt access log mặc định của Tomcat theo cấu hình prod hiện tại.
server.tomcat.accesslog.enabled=false
