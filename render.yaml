# FREE DEMO: SQLite changes are ephemeral; the reviewed bundle is restored on restart.
# This file does not create a SQL Server database. Supply an online SQL Server/Azure SQL.
services:
  - type: web
    name: homestay-mochi-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: COOKIE_SECURE
        value: "true"
      - key: DB_ENCRYPT
        value: "true"
      - key: DB_TRUST_SERVER_CERTIFICATE
        value: "false"
      - key: DB_PORT
        value: "1433"
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: AI_RAG_DB_PATH
        value: /tmp/homestay/assistant.sqlite3
