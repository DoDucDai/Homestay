<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dịch Vụ - Homestay Management</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!-- ================================================
     TRANG DICH VU
     NGUOI LAM HTML/CSS: SY DAI
     NGUOI LAM JS: BAN (LEADER) -> xem file js/services.js
     ================================================ -->

<div class="wrapper">

    <nav class="sidebar">
        <div class="logo">🏠 Homestay</div>
        <ul>
            <li><a href="rooms.html">🛏 Quản lý Phòng</a></li>
            <li><a href="customers.html">👤 Khách hàng</a></li>
            <li><a href="bookings.html">📅 Booking</a></li>
            <li><a href="checkin.html">✅ Check-in</a></li>
            <li><a href="checkout.html">💰 Check-out</a></li>
            <li><a href="services.html" class="active">🛎 Dịch vụ</a></li>
            <li><a href="statistics.html">📊 Thống kê</a></li>
            <li><a href="#" id="logout-btn">🚪 Đăng xuất</a></li>
        </ul>
    </nav>

    <div class="main-content">
        <h1 class="page-title">🛎 Quản Lý Dịch Vụ</h1>

        <div class="card">
            <button class="btn btn-success" onclick="openAddModal()">+ Thêm dịch vụ</button>
        </div>

        <div id="alert-message" class="alert" style="display:none;"></div>

        <div class="card">
            <table id="services-table">
                <thead>
                    <tr>
                        <th>Mã DV</th>
                        <th>Tên dịch vụ</th>
                        <th>Đơn giá</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="services-tbody">
                    <tr><td colspan="5" style="text-align:center;">Đang tải dữ liệu...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- MODAL THEM / SUA DICH VU -->
<div class="modal-overlay" id="service-modal">
    <div class="modal-box">
        <h3 id="modal-title">Thêm Dịch Vụ</h3>

        <input type="hidden" id="service-id">

        <div class="form-group">
            <label for="service-name">Tên dịch vụ *</label>
            <input type="text" id="service-name" placeholder="VD: Thuê xe máy, Giặt ủi...">
        </div>
        <div class="form-group">
            <label for="service-price">Đơn giá (VNĐ) *</label>
            <input type="number" id="service-price" placeholder="VD: 100000" min="0">
        </div>
        <div class="form-group">
            <label for="service-status">Trạng thái</label>
            <select id="service-status">
                <option value="Hoạt động">Hoạt động</option>
                <option value="Ngừng">Ngừng</option>
            </select>
        </div>

        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal()">Hủy</button>
            <button class="btn btn-primary" onclick="saveService()">Lưu</button>
        </div>
    </div>
</div>

<script src="../js/services.js"></script>

</body>
</html>
