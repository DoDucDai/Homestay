<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Phòng - Homestay Management</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!-- ================================================
     TRANG QUAN LY PHONG
     NGUOI LAM HTML/CSS: SY DAI
     NGUOI LAM JS: BAN (LEADER) -> xem file js/rooms.js
     ================================================ -->

<div class="wrapper">

    <!-- SIDEBAR -->
    <nav class="sidebar">
        <div class="logo">🏠 Homestay</div>
        <ul>
            <li><a href="rooms.html" class="active">🛏 Quản lý Phòng</a></li>
            <li><a href="customers.html">👤 Khách hàng</a></li>
            <li><a href="bookings.html">📅 Booking</a></li>
            <li><a href="checkin.html">✅ Check-in</a></li>
            <li><a href="checkout.html">💰 Check-out</a></li>
            <li><a href="services.html">🛎 Dịch vụ</a></li>
            <li><a href="statistics.html">📊 Thống kê</a></li>
            <li><a href="#" id="logout-btn">🚪 Đăng xuất</a></li>
        </ul>
    </nav>

    <!-- NOI DUNG CHINH -->
    <div class="main-content">
        <h1 class="page-title">🛏 Quản Lý Phòng</h1>

        <!-- Thanh cong cu -->
        <div class="card">
            <button class="btn btn-success" onclick="openAddModal()">+ Thêm phòng</button>
            <input type="text" id="search-input" placeholder="Tìm kiếm phòng..." style="padding:8px; margin-left:10px; border:1px solid #ccc; border-radius:5px;">
        </div>

        <!-- Thong bao -->
        <div id="alert-message" class="alert" style="display:none;"></div>

        <!-- Bang danh sach phong -->
        <div class="card">
            <table id="rooms-table">
                <thead>
                    <tr>
                        <th>Mã phòng</th>
                        <th>Tên phòng</th>
                        <th>Loại phòng</th>
                        <th>Giá / đêm</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="rooms-tbody">
                    <!-- Du lieu se duoc JS dien vao day -->
                    <tr><td colspan="6" style="text-align:center;">Đang tải dữ liệu...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- MODAL THEM / SUA PHONG -->
<div class="modal-overlay" id="room-modal">
    <div class="modal-box">
        <h3 id="modal-title">Thêm Phòng Mới</h3>

        <input type="hidden" id="room-id">

        <div class="form-group">
            <label for="room-code">Mã phòng *</label>
            <input type="text" id="room-code" placeholder="VD: P101">
        </div>
        <div class="form-group">
            <label for="room-name">Tên phòng *</label>
            <input type="text" id="room-name" placeholder="VD: Phòng Đôi Hướng Biển">
        </div>
        <div class="form-group">
            <label for="room-type">Loại phòng *</label>
            <select id="room-type">
                <option value="">-- Chọn loại --</option>
                <option value="Single">Single</option>
                <option value="Double">Double</option>
                <option value="VIP">VIP</option>
                <option value="Family">Family</option>
            </select>
        </div>
        <div class="form-group">
            <label for="room-price">Giá / đêm (VNĐ) *</label>
            <input type="number" id="room-price" placeholder="VD: 500000">
        </div>
        <div class="form-group">
            <label for="room-status">Trạng thái</label>
            <select id="room-status">
                <option value="Trống">Trống</option>
                <option value="Đã đặt">Đã đặt</option>
                <option value="Đang sử dụng">Đang sử dụng</option>
                <option value="Bảo trì">Bảo trì</option>
            </select>
        </div>
        <div class="form-group">
            <label for="room-desc">Mô tả</label>
            <textarea id="room-desc" rows="3" placeholder="Mô tả ngắn về phòng..."></textarea>
        </div>

        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal()">Hủy</button>
            <button class="btn btn-primary" onclick="saveRoom()">Lưu</button>
        </div>
    </div>
</div>

<!-- JS xu ly phong -->
<script src="../js/rooms.js"></script>

</body>
</html>
