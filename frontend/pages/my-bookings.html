<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đặt phòng của tôi - Homestay</title><link rel="icon" href="../css/images/homestay-logo.svg"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/customer.css"><link rel="stylesheet" href="../ai/assistant.css"></head>
<body class="session-pending customer-page" data-customer-view="bookings">
<a class="skip-link" href="#main-content">Bỏ qua điều hướng</a><div id="session-status" class="session-status" role="status"><span id="session-message">Đang kiểm tra phiên đăng nhập…</span><button id="session-retry" class="btn btn-secondary" hidden>Thử lại</button></div>
<div class="wrapper"><nav id="app-sidebar" class="sidebar" aria-label="Điều hướng chính"></nav><main id="main-content" class="main-content" tabindex="-1">
<header class="customer-heading"><div><p class="customer-eyebrow">LỊCH SỬ CỦA BẠN</p><h1>Đặt phòng của tôi</h1><p>Tất cả đơn phòng của tài khoản, gồm đơn chưa thanh toán, đã hủy và hết hạn.</p></div><a href="reserve.html" class="btn btn-primary">Đặt phòng mới</a></header>
<div id="alert-message" class="alert" role="status" style="display:none"></div>
<div class="customer-filter"><label for="customer-status-filter">Trạng thái lưu trú</label><select id="customer-status-filter"><option value="">Tất cả</option><option value="Confirmed">Chờ thanh toán / nhận phòng</option><option value="CheckedIn">Đang lưu trú</option><option value="CheckedOut">Đã hoàn tất</option><option value="Cancelled">Đã hủy</option><option value="Expired">Hết hạn giữ phòng</option></select><button id="customer-refresh" type="button" class="btn btn-secondary">Làm mới</button></div>
<p id="customer-list-status" role="status" aria-live="polite">Đang tải đơn của bạn…</p><section id="customer-detail" class="customer-detail" tabindex="-1" aria-label="Chi tiết đơn đặt phòng" hidden></section><section id="customer-list" class="customer-list" aria-label="Danh sách đơn đặt phòng"></section>
</main></div><script src="../js/api.js"></script><script src="../js/shell.js"></script><script src="../js/account.js"></script><script src="../js/vendor/qrcode.js"></script><script src="../js/customer-common.js"></script><script src="../js/customer-history.js"></script><script src="../ai/widget.js"></script></body></html>
